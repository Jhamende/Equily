name: Signed pre-release
on:
  push:
    tags: ["v0.1.0"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: |
          test -f ACCEPTANCE.md
          grep -qx 'State: accepted' ACCEPTANCE.md
          ./gradlew :app:testDebugUnitTest :app:lintDebug
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build with dedicated release key
        env:
          EQUILY_KEYSTORE_BASE64: ${{ secrets.EQUILY_KEYSTORE_BASE64 }}
          EQUILY_STORE_PASSWORD: ${{ secrets.EQUILY_STORE_PASSWORD }}
          EQUILY_KEY_ALIAS: ${{ secrets.EQUILY_KEY_ALIAS }}
          EQUILY_KEY_PASSWORD: ${{ secrets.EQUILY_KEY_PASSWORD }}
        run: |
          umask 077
          test -n "$EQUILY_KEYSTORE_BASE64"
          export EQUILY_KEYSTORE="$RUNNER_TEMP/equily-release.jks"
          printf '%s' "$EQUILY_KEYSTORE_BASE64" | base64 --decode > "$EQUILY_KEYSTORE"
          trap 'rm -f "$EQUILY_KEYSTORE"' EXIT
          ./gradlew :app:assembleRelease
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/Equily-v0.1.0-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release-artifacts/Equily-v0.1.0-release.apk
          certificate_sha=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs release-artifacts/Equily-v0.1.0-release.apk | awk -F ': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}')
          test "$certificate_sha" = '8d2b647d441ce637e5bfa3e47923ddb18944aaec41f85ac51760907e18411413'
          cd release-artifacts
          sha256sum Equily-v0.1.0-release.apk > SHA256SUMS
      - name: Publish verified pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 release-artifacts/Equily-v0.1.0-release.apk release-artifacts/SHA256SUMS --verify-tag --prerelease --title 'Equily v0.1.0 — Initial Android Release' --notes-file CHANGELOG.md
